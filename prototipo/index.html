<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Divisio – prototipo</title>
<style>
:root{
  --bg:#f5f3ee; --card:#fff; --ink:#1f2933; --muted:#5f6b76; --line:#e2ddd2;
  --accent:#1f4e79; --accent-soft:#e7eef6; --gold:#a8761f;
  --in:#2e7d4f; --in-soft:#e6f4ec; --out:#b3261e; --out-soft:#fdecea;
  --warn:#8a5300; --warn-soft:#fff3dc; --move:#1f4e79;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.banner{background:var(--warn-soft);color:var(--warn);text-align:center;font-size:15px;padding:6px 16px;border-bottom:1px solid #f0dfb8}
header{background:var(--accent);color:#fff;padding:14px 16px}
header .wrap{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:26px;letter-spacing:.5px}
header .sub{opacity:.85;font-size:16px}
nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav .wrap{display:flex;gap:4px;overflow-x:auto;padding:0 8px}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 12px;font:inherit;font-size:16px;color:var(--muted);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.wrap{max-width:1040px;margin:0 auto}
main{padding:20px 16px 80px}
h2{font-size:24px;margin:4px 0 4px}
h3{font-size:19px;margin:0 0 10px}
.lead{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.saldo .lab{color:var(--muted);font-size:15px}
.saldo .val{font-size:26px;font-weight:650}
.big-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.big{border:0;border-radius:12px;padding:18px 14px;font:inherit;font-size:19px;font-weight:600;cursor:pointer;text-align:left;color:#fff}
.big small{display:block;font-weight:400;font-size:14px;opacity:.9}
.b-in{background:var(--in)} .b-out{background:var(--out)} .b-move{background:var(--move)} .b-doc{background:var(--gold)}
.btn{display:inline-block;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:9px;padding:10px 16px;font:inherit;font-size:17px;cursor:pointer}
.btn.sec{background:#fff;color:var(--accent)}
.btn.small{font-size:15px;padding:6px 10px}
.btn.danger{background:#fff;color:var(--out);border-color:var(--out)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:block;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=date],input[type=number],select{font:inherit;font-size:18px;padding:10px 12px;border:1px solid #c9c2b3;border-radius:9px;background:#fff;width:100%}
input.amount{font-size:24px;font-weight:600;max-width:240px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:150px;border:2px solid var(--line);background:#fff;border-radius:10px;padding:12px;font:inherit;font-size:18px;cursor:pointer}
.seg button.on.in{border-color:var(--in);background:var(--in-soft);color:var(--in);font-weight:650}
.seg button.on.out{border-color:var(--out);background:var(--out-soft);color:var(--out);font-weight:650}
.seg button.on.move{border-color:var(--move);background:var(--accent-soft);color:var(--move);font-weight:650}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:7px 14px;font:inherit;font-size:16px;cursor:pointer;text-align:left}
.chip.sel{background:var(--accent);color:#fff}
.chip small{display:block;font-size:13px;opacity:.85}
.hint{color:var(--muted);font-size:15px}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:16px;margin-top:10px}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:16px;margin-top:10px}
.okbox{background:var(--in-soft);color:var(--in);border-radius:10px;padding:10px 14px;font-size:16px;margin-top:10px}
.badbox{background:var(--out-soft);color:var(--out);border-radius:10px;padding:10px 14px;font-size:16px;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.3px}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:700;background:#faf8f3}
tr.grp td{font-weight:650;color:var(--accent);background:var(--accent-soft)}
tr.big td{font-weight:750;font-size:17px;background:#f1ede4}
.zero{color:#a7a196}
.pos{color:var(--in)} .neg{color:var(--out)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;color:var(--muted)}
.tablewrap{overflow-x:auto}
details{margin-top:10px}
summary{cursor:pointer;color:var(--accent);font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2933;color:#fff;padding:12px 20px;border-radius:10px;font-size:17px;box-shadow:0 6px 24px rgba(0,0,0,.2);z-index:20}
.steps{margin:0;padding-left:22px} .steps li{margin:4px 0}
.sp{flex:1}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600}
.pill.in{background:var(--in-soft);color:var(--in)} .pill.out{background:var(--out-soft);color:var(--out)} .pill.move{background:var(--accent-soft);color:var(--move)}
@media print{.banner,header,nav,.noprint{display:none!important} body{background:#fff;font-size:12pt} .card{border:0;padding:0} main{padding:0}}
@media (max-width:600px){body{font-size:17px} .saldo .val{font-size:22px} th,td{padding:6px 4px}}
</style>
</head>

<script>

const GRUPPI = [], VOCI = [], CONTI = {};
(function parsePiano(){
  let cur = null;
  PIANO_TXT.trim().split("\n").forEach(l => {
    if (l.startsWith("#")) { const [t,g,n] = l.slice(1).split("|"); cur = {t,g,n,conti:[]}; GRUPPI.push(cur); return; }
    const [c,n,subs] = l.split("|");
    const voce = {code:cur.g+"-"+c, g:cur.g, n, t:cur.t, subs:[]};
    cur.conti.push(voce); VOCI.push(voce);
    subs.split(";").forEach(s => { const code = voce.code+"-"+s.slice(0,2); CONTI[code] = {code, n:s.slice(3), voce, t:cur.t}; voce.subs.push(code); });
  });
})();
const CASSA="A02-01-01", BANCA="A02-01-02", PAYPAL="A02-01-03";
const FIN=[CASSA,BANCA,PAYPAL];
const isFin = c => FIN.includes(c);

/* =====================  UTILITÀ  ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const EUR = new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"});
const eur = c => EUR.format(c/100);
const eurCell = c => `<td class="n ${c===0?"zero":""}">${eur(c)}</td>`;
const dIt = d => d ? d.split("-").reverse().join("/") : "";
function parseEuro(s){
  s = String(s||"").replace(/[\s€]/g,"");
  if (!s) return 0;
  if (s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
  const x = parseFloat(s); return isFinite(x) ? Math.round(x*100) : NaN;
}
const csvNum = c => { let s=(c/100).toFixed(2).replace(/0+$/,"").replace(/\.$/,""); return s.replace(".",","); };
const csv2 = c => (c/100).toFixed(2).replace(".",",");
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const tokens = s => norm(s).split(/[^a-z0-9]+/).filter(t => t.length>=3 && !STOP.has(t));
const STOP = new Set("per del della dei delle con una uno gli the and nel nella alla alle dal dalla fattura offerta offerte pagamento euro anno mese srl spa snc sas nr".split(" "));
const OGGI = "2026-11-15";
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; $("#toast-slot").appendChild(t); setTimeout(()=>t.remove(),2600); }
function download(name, text, type){ const b=new Blob([text],{type}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500); }
function nomeConto(c){ return CONTI[c] ? CONTI[c].n : c; }

/* =====================  DATI INVENTATI  ===================== */
let nextId = 1;
function mk(data, descr, tipo, a, b, euro){
  const c = Math.round(euro*100); let righe;
  if (tipo==="entrata") righe=[{c:a,d:c,a:0},{c:b,d:0,a:c}];          // a = cassa/banca, b = voce
  else if (tipo==="uscita") righe=[{c:b,d:c,a:0},{c:a,d:0,a:c}];      // a = cassa/banca, b = voce
  else righe=[{c:b,d:c,a:0},{c:a,d:0,a:c}];                            // spostamento: da a → verso b
  return {id:nextId++, data, descr, tipo, righe};
}
function apertura(cassa, banca, paypal, colletteDaVersare){
  const righe=[{c:CASSA,d:cassa,a:0},{c:BANCA,d:banca,a:0},{c:PAYPAL,d:paypal,a:0}];
  if (colletteDaVersare) righe.push({c:"PG1-01-08",d:0,a:colletteDaVersare});
  const pat = cassa+banca+paypal-colletteDaVersare;
  righe.push(pat>=0 ? {c:"PAT-01-01",d:0,a:pat} : {c:"PAT-01-01",d:-pat,a:0});
  return {id:nextId++, data:"2026-01-01", descr:"Saldi di apertura al 1° gennaio 2026", tipo:"apertura", righe:righe.filter(r=>r.d||r.a)};
}
function datiEsempio(){
  nextId = 1;
  const E="entrata", U="uscita", S="spostamento";
  return {
    parrocchia:{nome:"Parrocchia di San Esempio", icsc:"0000000", comune:"Esempiopoli", parroco:"don Mario Esempio"},
    anno:2026, learn:{}, previsione:{}, ultimoBackup:null,
    mov:[
      apertura(85000, 1240000, 12000, 30000),
      mk("2026-01-11","Colletta domenicale",E,CASSA,"E01-02-01",410),
      mk("2026-01-18","Offerta funerale",E,CASSA,"E01-03-05",150),
      mk("2026-01-20","Bolletta luce gennaio",U,BANCA,"U08-01-01",186.40),
      mk("2026-01-25","Intenzioni Messe",E,CASSA,"E01-01-02",90),
      mk("2026-02-01","Colletta domenicale",E,CASSA,"E01-02-01",385),
      mk("2026-02-05","Versamento contanti in banca",S,CASSA,BANCA,700),
      mk("2026-02-10","Fiori per l'altare",U,CASSA,"U01-02-02",45),
      mk("2026-02-15","TIM telefono e fibra",U,BANCA,"U08-01-04",57.10),
      mk("2026-02-22","Benedizione delle famiglie",E,CASSA,"E01-04-01",620),
      mk("2026-03-08","Assicurazione fabbricati",U,BANCA,"U06-01-01",650),
      mk("2026-03-15","Offerta battesimo",E,CASSA,"E01-03-01",100),
      mk("2026-03-22","Raccolta Quaresima di carità",E,CASSA,"PG1-01-03",480),
      mk("2026-03-29","Vino e ostie",U,CASSA,"U01-02-01",78.50),
      mk("2026-04-05","Colletta domenicale di Pasqua",E,CASSA,"E01-02-01",1250),
      mk("2026-04-12","Versamento Quaresima di carità alla Diocesi",U,BANCA,"PG1-01-03",480),
      mk("2026-04-20","Gas riscaldamento",U,BANCA,"U08-01-02",412.30),
      mk("2026-05-03","Offerte Prime Comunioni",E,CASSA,"E01-03-02",540),
      mk("2026-05-10","Versamento contanti in banca",S,CASSA,BANCA,1500),
      mk("2026-05-14","TIM telefono e fibra",U,BANCA,"U08-01-04",57.10),
      mk("2026-05-24","Offerte Cresime",E,CASSA,"E01-03-03",380),
      mk("2026-06-07","Offerta matrimonio",E,BANCA,"E01-03-04",300),
      mk("2026-06-15","Riparazione caldaia",U,BANCA,"U05-03-01",1220),
      mk("2026-06-20","Donazioni online parrocchiani",E,PAYPAL,"E01-04-05",150),
      mk("2026-07-05","Campo scuola ragazzi",U,BANCA,"U01-01-03",900),
      mk("2026-07-12","Colletta domenicale",E,CASSA,"E01-02-01",290),
      mk("2026-08-10","Spese bancarie trimestre",U,BANCA,"U08-02-07",24),
      mk("2026-09-13","Offerte lumi votivi",E,CASSA,"E01-04-02",210),
      mk("2026-09-20","Rimborso viaggio sacerdote",U,CASSA,"U02-03-02",60),

      mk("2026-11-08","Versamento Giornata missionaria alla Diocesi",U,BANCA,"PG1-01-08",860),

    ]
  };
}
let S = datiEsempio();

/* =====================  CALCOLI CONTABILI  ===================== */
function totals(filter){
  const t={};
  S.mov.forEach(m => { if (filter && !filter(m)) return; m.righe.forEach(r => { const x=(t[r.c] ||= {d:0,a:0}); x.d+=r.d; x.a+=r.a; }); });
  return t;
}
function nat(code, t){ const x=t[code]; if(!x) return 0; const k=CONTI[code].t; return (k==="A"||k==="U") ? x.d-x.a : x.a-x.d; }
const anno = m => m.data.slice(0,4)===String(S.anno);
function saldoFin(code){ return nat(code, totals(anno)); }
function quadraTutti(){ return S.mov.every(m => m.righe.reduce((s,r)=>s+r.d,0) === m.righe.reduce((s,r)=>s+r.a,0)); }

function calcRendiconto(){
  const t = totals(anno);
  const v = {}; VOCI.forEach(x => v[x.code] = x.subs.reduce((s,c)=>s+nat(c,t),0));
  const sumG = g => GRUPPI.find(x=>x.g===g).conti.reduce((s,x)=>s+v[x.code],0);
  const sumT = types => GRUPPI.filter(x=>types.includes(x.t)).reduce((s,x)=>s+sumG(x.g),0);
  const T01=sumT(["E"]), T02=sumT(["U"]), F=T01-T02;
  const att=sumT(["A"]), pas=sumT(["P","PG"]), pat=sumT(["PAT"]);
  const ap = totals(m => m.tipo==="apertura" && anno(m)), yr = totals(m => m.tipo!=="apertura" && anno(m));
  const collette = VOCI.filter(x=>x.g==="PG1").flatMap(x=>x.subs).map(c => {
    const C3=nat(c,ap), C1=yr[c]?.a||0, C2=yr[c]?.d||0; return {c, C1, C2, C3, resto:C3+C1-C2};
  });
  const base3 = sumG("E01")+v["E03-01"]+v["E04-01"]+v["E04-02"], base10 = v["E02-03"]+v["E03-02"];
  const c3 = Math.round(base3*0.03), c10 = Math.round(base10*0.10);
  return {t, v, sumG, T01, T02, F, att, pas, pat, collette, base3, base10, c3, c10, quadra: att===pas+pat+F};
}

function compatibile(code, tipo){ const k=CONTI[code].t; if (tipo==="entrata") return k!=="U"; if (tipo==="uscita") return k!=="E"; return true; }
function suggerisci(testo, tipo){
  const toks = tokens(testo), score = {}, perche = {};
  const add = (c,w,why) => { if(!compatibile(c,tipo)) return; score[c]=(score[c]||0)+w; if(!perche[c]) perche[c]=why; };
  REGOLE.forEach(r => {
    if (r.d!=="*" && r.d!==(tipo==="entrata"?"E":"U")) return;
    toks.forEach(tk => r.parole.forEach(p => { if (tk.startsWith(p)) add(r.c, r.w, `contiene «${tk}»`); }));
  });
  toks.forEach(tk => { const l=S.learn[tk]; if(!l) return; Object.entries(l).forEach(([c,n]) => add(c, 2*n, `l'ha già scelta per «${tk}»`)); });
  return Object.entries(score).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([c]) => ({c, why:perche[c]}));
}
function impara(testo, code, correzione){
  tokens(testo).forEach(tk => { const l=(S.learn[tk] ||= {}); l[code]=(l[code]||0)+(correzione?2:1); });
}

function descriviMov(m){

  if (m.tipo==="apertura") return {voce:"Saldi di apertura", conto:"", imp:m.righe.reduce((s,r)=>s+r.d,0), cls:""};

  return {voce: altri.length===1 ? `${CONTI[altri[0].c].n} <span class="code">${altri[0].c}</span>` : "Più voci",
    conto: fins.map(r=>nomeConto(r.c)).join(", ") || "—", imp: fins.length? net : altri.reduce((s,r)=>s+r.d,0), cls: !fins.length?"":net>=0?"in":"out"};

function leggiFatturaXML(txt, nomeFile){
  const doc = new DOMParser().parseFromString(txt, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) throw new Error("non è un file XML leggibile (se finisce in .p7m arriverà nella versione completa)");
  const trova = (root, nome) => { if(!root) return null; for (const e of root.getElementsByTagName("*")) if (e.localName===nome) return e; return null; };
  const testo = (root, ...path) => { let el=root; for (const p of path) el=trova(el,p); return el ? el.textContent.trim() : ""; };
  const tutti = nome => [...doc.getElementsByTagName("*")].filter(e=>e.localName===nome);
  const ced = trova(doc,"CedentePrestatore");
  if (!ced) throw new Error("non sembra una FatturaPA");
  const forn = testo(ced,"Denominazione") || `${testo(ced,"Nome")} ${testo(ced,"Cognome")}`.trim();
  const dg = trova(doc,"DatiGeneraliDocumento");
  const imp = tutti("ImponibileImporto").reduce((s,e)=>s+Math.round(parseFloat(e.textContent)*100),0);
  const iva = tutti("Imposta").reduce((s,e)=>s+Math.round(parseFloat(e.textContent)*100),0);
  const tot = testo(dg,"ImportoTotaleDocumento") ? Math.round(parseFloat(testo(dg,"ImportoTotaleDocumento"))*100) : imp+iva;
  const righe = tutti("DettaglioLinee").map(l=>testo(l,"Descrizione")).filter(Boolean);
  const f = {file:nomeFile, forn, piva:testo(ced,"IdFiscaleIVA","IdCodice"), numero:testo(dg,"Numero"), data:testo(dg,"Data"),
    descr:righe.join(" · "), imp, iva, tot, scad:testo(doc,"DataScadenzaPagamento"), pagata:OGGI, fin:BANCA, code:"", stato:"da confermare"};
  f.proposte = suggerisci(f.forn+" "+f.descr, "uscita");
  f.doppia = S.mov.some(m => m.fattura && m.fattura.piva===f.piva && m.fattura.numero===f.numero);
  return f;
}

function diff(code, val){
  if (!confronto || !(code in confronto.v)) return "";
  return confronto.v[code]===val ? ` <span class="pill in">= UNIO</span>` : ` <span class="pill out">UNIO: ${eur(confronto.v[code])}</span>`;
}
function riepilogoConfronto(r){
  const diverse = Object.keys(confronto.v).filter(k => r.v[k]!==undefined && r.v[k]!==confronto.v[k]);
  return diverse.length===0 ? `<div class="okbox">✓ Tutte le ${Object.keys(confronto.v).length} voci coincidono con UNIO (file ${esc(confronto.nome)}).</div>`
    : `<div class="warnbox">${diverse.length} voci su ${Object.keys(confronto.v).length} sono diverse da UNIO (file ${esc(confronto.nome)}). Sono segnate in rosso qui sotto.</div>`;
}
async function caricaConfronto(file){
  if (!file) return;
  const righe = (await file.text()).split(/\r?\n/).slice(1).filter(l=>l.trim());
  const v = {};
  righe.forEach(l => { const f=l.split(";"); if (f.length>=8) v[`${f[4]}-${f[5]}`] = parseEuro(f[7]); });
  if (!Object.keys(v).length) { toast("Il file non sembra il CSV dei saldi di UNIO"); return; }
  confronto = {nome:file.name, v}; render();
}

let unioSel = {fin:BANCA, periodo:"T4", fatti:{}};
function righeUNIO(fin, periodo){
  const [a,b,lab] = PERIODI[periodo]; const da=`${S.anno}-${a}`, al=`${S.anno}-${b}`;
  const gruppi = {}, altrove = [];
  S.mov.filter(m => m.tipo!=="apertura" && m.data>=da && m.data<=al).forEach(m => {
    const mie = m.righe.filter(r=>r.c===fin); if (!mie.length) return;
    const altri = m.righe.filter(r=>r.c!==fin);
    const altreFin = altri.filter(r=>isFin(r.c));
    if (altreFin.length) {
      const ricevo = mie.reduce((s,r)=>s+r.d-r.a,0) > 0;
      if (!ricevo) { altrove.push(m); return; }   // lo spostamento si importa nel file del conto che riceve
    }
    altri.forEach(r => {
      const dir = r.a>0 ? "E" : "U", imp = r.a>0 ? r.a : r.d;
      const k = r.c+"|"+dir; const g = (gruppi[k] ||= {code:r.c, dir, imp:0, n:0, data:""});
      g.imp += imp; g.n++; if (m.data>g.data) g.data=m.data;
    });
  });
  const lista = Object.values(gruppi).sort((x,y)=>x.code.localeCompare(y.code)||x.dir.localeCompare(y.dir))
    .map(g => ({...g, descr:`[${g.code}] ${CONTI[g.code].n} – ${lab} ${S.anno} (${g.n} mov.)`}));
  const senzaCassa = S.mov.filter(m => m.tipo!=="apertura" && m.data>=da && m.data<=al && !m.righe.some(r=>isFin(r.c)));
  return {lista, altrove, senzaCassa, lab};
}

  const {lista, altrove, senzaCassa, lab} = righeUNIO(unioSel.fin, unioSel.periodo);
  const te = lista.filter(x=>x.dir==="E").reduce((s,x)=>s+x.imp,0), tu = lista.filter(x=>x.dir==="U").reduce((s,x)=>s+x.imp,0);
  return `<h2>Prepara i dati per UNIO</h2>
  <p class="lead">Divisio riassume i movimenti in poche righe, una per voce. In UNIO basterà caricare il file e scegliere il codice indicato all'inizio di ogni riga.</p>
  <div class="card noprint"><div class="grid g2">
    <div><label class="f">Cassa o banca</label><div class="seg">${FIN.map(c=>`<button type="button" class="${c===unioSel.fin?"on move":""}" onclick="unioSel.fin='${c}';render()">${nomeConto(c)}</button>`).join("")}</div></div>
    <div><label class="f">Periodo</label><select onchange="unioSel.periodo=this.value;render()">${Object.entries(PERIODI).map(([k,p])=>`<option value="${k}" ${k===unioSel.periodo?"selected":""}>${k==="A"?"Anno intero":p[2]+" "+S.anno}</option>`).join("")}</select></div>
  </div>
  <h3 style="margin-top:18px">Come si fa</h3><ol class="steps">
    <li>Prema <b>Scarica il file per UNIO</b>.</li>
    <li>In UNIO: Partita Doppia → quadratino giallo (Importazione Prima Nota) → Conto di riferimento: <b>${nomeConto(unioSel.fin)}</b> <span class="code">${unioSel.fin}</span> → carichi il file.</li>
    <li>Per ogni riga scelga in UNIO il codice tra parentesi quadre e spunti la casella qui sotto.</li>
    <li>Alla fine, nella pagina <a href="#" onclick="vai('rendiconto');return false">Rendiconto</a>, carichi il CSV dei saldi di UNIO per controllare che tutto torni.</li></ol>
  <div class="row" style="margin-top:12px"><button class="btn" ${lista.length?"":"disabled"} onclick="scaricaUNIO()">Scarica il file per UNIO</button><button class="btn sec" onclick="window.print()">Stampa il foglio guida</button></div></div>
  <div class="card"><h3>Foglio guida · ${nomeConto(unioSel.fin)} · ${lab} ${S.anno}</h3>
  ${lista.length?`<div class="tablewrap"><table><tr><th>Data</th><th>Descrizione</th><th class="n">Uscite</th><th class="n">Entrate</th><th>Codice da scegliere in UNIO</th><th>Fatto</th></tr>
    ${lista.map(x=>{const k=unioSel.fin+unioSel.periodo+x.code+x.dir; return `<tr><td>${dIt(x.data)}</td><td>${esc(x.descr)}</td><td class="n">${x.dir==="U"?eur(x.imp):""}</td><td class="n">${x.dir==="E"?eur(x.imp):""}</td>
      <td><b>${x.code.split("-").join(" – ")}</b><br><span class="hint">${esc(CONTI[x.code].n)}</span></td><td><input type="checkbox" style="width:22px;height:22px" ${unioSel.fatti[k]?"checked":""} onchange="unioSel.fatti['${k}']=this.checked"></td></tr>`;}).join("")}
    <tr class="tot"><td colspan="2">Totale (${lista.length} righe)</td><td class="n">${eur(tu)}</td><td class="n">${eur(te)}</td><td colspan="2"></td></tr></table></div>`
    : `<p class="hint">Nessun movimento di ${nomeConto(unioSel.fin)} in questo periodo.</p>`}
  ${altrove.length?`<div class="note">${altrove.length} spostamento/i verso altre casse non compaiono qui: si importano nel file del conto che riceve i soldi, così non vengono contati due volte.</div>`:""}
  ${senzaCassa.length?`<div class="warnbox">${senzaCassa.length} movimento/i senza cassa né banca (es. dati del teatro) vanno inseriti a mano in UNIO: ${senzaCassa.map(m=>esc(m.descr)).join("; ")}.</div>`:""}
  </div>`;
};
function scaricaUNIO(){
  const {lista, lab} = righeUNIO(unioSel.fin, unioSel.periodo);
  const testo = lista.map(x => [dIt(x.data), x.descr.replace(/;/g,","), x.dir==="U"?csv2(x.imp):"0,00", x.dir==="E"?csv2(x.imp):"0,00"].join(";")).join("\r\n");
  download(`UNIO_${nomeConto(unioSel.fin)}_${lab.replace(/[°. ]/g,"")}_${S.anno}.csv`, testo, "text/csv;charset=utf-8");
}

/* ----- IMPOSTAZIONI ----- */
VISTE.impostazioni = () => {
  const ap = S.mov.find(m=>m.tipo==="apertura");
  const val = c => { const r=ap&&ap.righe.find(x=>x.c===c); return r? csv2(r.d||r.a) : ""; };
  const parole = Object.entries(S.learn).flatMap(([tk,m]) => Object.entries(m).map(([c,n])=>({tk,c,n}))).sort((a,b)=>b.n-a.n);
  return `<h2>Impostazioni</h2><p class="lead">Dati della parrocchia, saldi iniziali e copie di sicurezza.</p>
  <div class="card"><h3>Copia di sicurezza</h3>
    <p style="margin-top:0">Salvi spesso una copia su file (per esempio su una chiavetta o in una cartella sincronizzata). Se il computer si rompe, con quel file si riparte.</p>
    <div class="row"><button class="btn" onclick="salvaBackup()">Salva una copia su file</button>
    <label class="btn sec">Ripristina da file…<input type="file" accept=".json" style="display:none" onchange="ripristina(this.files[0])"></label>
    <button class="btn danger" onclick="if(confirm('Tornare ai dati di esempio iniziali?')){S=datiEsempio();fatture=[];confronto=null;render();}">Ricomincia con i dati di esempio</button></div></div>
  <div class="card"><h3>Saldi di apertura al 1° gennaio ${S.anno}</h3>
    <p class="hint" style="margin-top:0">Quanto c'era davvero in cassa e in banca all'inizio dell'anno. Si possono inserire anche più tardi: il Rendiconto si aggiorna da solo.</p>
    <div class="grid g4">
      ${FIN.map(c=>`<div><label class="f">${nomeConto(c)}</label><input type="text" inputmode="decimal" id="ap-${c}" value="${val(c)}"></div>`).join("")}
      <div><label class="f">Collette non ancora versate</label><input type="text" inputmode="decimal" id="ap-PG" value="${val("PG1-01-08")}"></div>
    </div>
    <p class="hint">Divisio calcola da solo il Patrimonio netto (la differenza).</p>
    <button class="btn" onclick="salvaApertura()">Salva i saldi di apertura</button></div>
  <div class="card"><h3>Parrocchia</h3><div class="grid g2">
    ${[["nome","Nome"],["icsc","Codice ICSC"],["comune","Comune"],["parroco","Parroco"]].map(([k,n])=>`<div><label class="f">${n}</label><input type="text" value="${esc(S.parrocchia[k])}" onchange="S.parrocchia['${k}']=this.value;render()"></div>`).join("")}
  </div></div>
  <div class="card"><h3>Parole imparate</h3>
    ${parole.length?`<p class="hint" style="margin-top:0">Divisio ricorda le sue scelte per proporre la voce giusta la prossima volta.</p><table><tr><th>Parola</th><th>Voce scelta</th><th class="n">Volte</th><th></th></tr>
      ${parole.map(p=>`<tr><td>${esc(p.tk)}</td><td>${esc(CONTI[p.c].n)} <span class="code">${p.c}</span></td><td class="n">${p.n}</td><td><button class="btn danger small" onclick="delete S.learn['${p.tk}']['${p.c}'];render()">Dimentica</button></td></tr>`).join("")}</table>`
      : `<p class="hint" style="margin:0">Ancora nessuna. Registri qualche movimento scegliendo la voce: Divisio imparerà.</p>`}</div>
  <div class="card"><details><summary>Piano dei conti (${Object.keys(CONTI).length} sottoconti)</summary>
    ${GRUPPI.map(g=>`<p style="margin:12px 0 4px"><b>${g.g} ${esc(g.n)}</b></p><ul style="margin:0">${g.conti.map(v=>`<li>${v.code.slice(-2)} ${esc(v.n)}: <span class="hint">${v.subs.map(c=>esc(CONTI[c].n)).join(" · ")}</span></li>`).join("")}</ul>`).join("")}
  </details></div>`;
};
function salvaApertura(){
  const v = id => { const x=parseEuro($("#"+id).value); return isNaN(x)?0:x; };
  const nuovo = apertura(v("ap-"+CASSA), v("ap-"+BANCA), v("ap-"+PAYPAL), v("ap-PG"));
  S.mov = S.mov.filter(m=>m.tipo!=="apertura"); S.mov.unshift(nuovo); toast("Saldi di apertura salvati ✓"); render();
}
function salvaBackup(){
  S.ultimoBackup = new Date().toLocaleString("it-IT");
  download(`divisio-copia-${OGGI}.json`, JSON.stringify({app:"Divisio", formato:1, salvatoIl:new Date().toISOString(), dati:S}, null, 1), "application/json");
  toast("Copia salvata ✓"); render();
}
async function ripristina(file){
  if (!file) return;
  try {
    const j = JSON.parse(await file.text());
    if (j.app!=="Divisio" || !j.dati || !Array.isArray(j.dati.mov)) throw new Error();
    if (!confirm(`Sostituire i dati attuali con la copia del ${new Date(j.salvatoIl).toLocaleString("it-IT")}?`)) return;
    S = j.dati; nextId = Math.max(0,...S.mov.map(m=>m.id))+1; toast("Copia ripristinata ✓"); render();
  } catch { toast("Questo file non è una copia di Divisio"); }
}

render();
</script>
</body>
</html>
